<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profit Calculator</title>
</head>
<body>
  <h1>Profit Calculator</h1>

  <label>Sale price ($) <input id="price" type="number" step="0.01" value="0"></label><br>
  <label>Fees ($) <input id="fees" type="number" step="0.01" value="0"></label><br>
  <label>Shipping ($) <input id="shipping" type="number" step="0.01" value="0"></label><br>
  <label>Cost ($) <input id="cost" type="number" step="0.01" value="0"></label><br>
  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      const price = Number(document.getElementById("price").value);
      const fees = Number(document.getElementById("fees").value);
      const shipping = Number(document.getElementById("shipping").value);
      const cost = Number(document.getElementById("cost").value);
      const profit = price - fees - shipping - cost;
      document.getElementById("result").textContent = "Profit: $" + profit.toFixed(2);
    }
  </script>
</body>
</html>
