<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
    label { display: block; margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #ccc; padding: 6px; text-align: left; }
    #cancel-edit { display: none; }
    .goal { border-bottom: 1px solid #ccc; padding: 8px 0; }
    .goal progress { width: 100%; height: 16px; }
    .done { color: #666; text-decoration: line-through; }
  </style>
</head>
<body>
  <h1>Resale Tracker</h1>

  <h2>Items</h2>
  <form id="item-form">
    <label>Item name <input id="name" required></label>
    <label>Site
      <select id="site">
        <option>Depop</option>
        <option>Vinted</option>
      </select>
    </label>
    <label>Status
      <select id="status">
        <option>Not photographed</option>
        <option>Photographed</option>
        <option>Listed</option>
        <option>Sold</option>
      </select>
    </label>
