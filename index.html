<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
    label { display: block; margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #ccc; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>Resale Tracker</h1>

  <form id="item-form">
    <label>Item name <input id="name" required></label>
    <label>Site
      <select id="site">
        <option>Depop</option>
        <option>Vinted</option>
      </select>
    </label>
    <label>Status
      <select id="status">
        <option>Not photographed</option>
        <option>Photographed</option>
        <option>Listed</option>
        <option>Sold</option>
      </select>
    </label>
    <label>Sale price ($) <input id="price" type="number" step="0.01" min="0" value="0"></label>
    <label>Fees ($) <input id="fees" type="number" step="0.01" min="0" value="0"></label>
    <label>Shipping ($) <input id="shipping" type="number" step="0.01" min="0" value="0"></label>
    <label>Cost ($) <input id="cost" type="number" step="0.01" min="0" value="0"></label>
    <button type="submit">Add item</button>
  </form>

  <h2>Total profit: $<span id="total">0.00</span></h2>

  <table>
    <thead>
      <tr><th>Item</th><th>Site</th><th>Status</th><th>Profit</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    let items = [];
    try {
      items = JSON.parse(localStorage.getItem("items")) || [];
    } catch (e) {
      items = [];
    }

    function save() {
      try {
        localStorage.setItem("items", JSON.stringify(items));
      } catch (e) {}
    }

    function profitOf(item) {
      return item.price - item.fees - item.shipping - item.cost;
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      let total = 0;

      items.forEach(function (item, index) {
        const row = document.createElement("tr");
        const profit = item.status === "Sold" ? profitOf(item) : null;
        if (profit !== null) total += profit;

        const cells = [
          item.name,
          item.site,
          item.status,
          profit === null ? "-" : "$" + profit.toFixed(2)
        ];
        cells.forEach(function (text) {
          const td = document.createElement("td");
          td.textContent = text;
          row.appendChild(td);
        });

        const actionCell = document.createElement("td");
        const button = document.createElement("button");
        button.textContent = "Delete";
        button.onclick = function () {
          if (confirm("Delete " + item.name + "?")) {
            items.splice(index, 1);
            save();
            render();
          }
        };
        actionCell.appendChild(button);
        row.appendChild(actionCell);

        list.appendChild(row);
      });

      document.getElementById("total").textContent = total.toFixed(2);
    }

    document.getElementById("item-form").addEventListener("submit", function (event) {
      event.preventDefault();
      items.push({
        name: document.getElementById("name").value,
        site: document.getElementById("site").value,
        status: document.getElementById("status").value,
        price: Number(document.getElementById("price").value),
        fees: Number(document.getElementById("fees").value),
        shipping: Number(document.getElementById("shipping").value),
        cost: Number(document.getElementById("cost").value)
      });
      save();
      render();
      event.target.reset();
    });

    render();
  </script>
</body>
</html>
