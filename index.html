<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="summary">
    <div class="stat main">
      <span class="stat-label">Available balance</span>
      <span class="stat-value balance">$<span id="balance">0.00</span></span>
    </div>
    <div class="stat">
      <span class="stat-label">Total profit</span>
      <span class="stat-value profit">$<span id="total">0.00</span></span>
    </div>

    <div class="side">
      <details id="balances">
        <summary>Platform balances</summary>
        <div class="dropdown-panel">
          <table id="balance-table">
            <thead>
              <tr><th>Platform</th><th>Starting balance ($)</th><th>Item profit</th><th>Total</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>Depop</td>
                <td><input id="start-Depop" type="number" step="0.01" min="0" placeholder="0.00"></td>
                <td id="item-Depop">$0.00</td>
                <td id="sum-Depop">$0.00</td>
              </tr>
              <tr>
                <td>Vinted</td>
                <td><input id="start-Vinted" type="number" step="0.01" min="0" placeholder="0.00"></td>
                <td id="item-Vinted">$0.00</td>
                <td id="sum-Vinted">$0.00</td>
              </tr>
              <tr>
                <td><strong>Combined</strong></td>
                <td id="start-all">$0.00</td>
                <td id="item-all">$0.00</td>
                <td id="sum-all"><strong>$0.00</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>

      <details id="goals-box">
        <summary>Goals</summary>
        <div class="dropdown-panel">
          <div id="overall-box">
            <div id="overall-text"></div>
            <progress id="overall-bar" value="0" max="1"></progress>
          </div>

          <div class="panel-row">
            <button type="button" id="add-goal-button">+ Add goal</button>
          </div>

          <form id="goal-form">
            <label>Goal name <input id="goal-name" required></label>
            <label>Amount ($) <input id="goal-amount" type="number" step="0.01" min="0.01" required></label>
            <button type="submit">Save goal</button>
          </form>

          <div id="goal-list"></div>
          <div id="no-goals">No goals in progress.</div>

          <details id="purchased-goals">
            <summary id="purchased-summary">Purchased goals (0)</summary>
            <div id="purchased-list"></div>
          </details>
        </div>
      </details>

      <div id="goals-mini">
        <progress id="mini-bar" value="0" max="1"></progress>
        <div id="mini-text" class="small"></div>
      </div>
    </div>
  </div>

  <div class="top">
    <h1>Resale Tracker</h1>
    <button type="button" id="export-button">Export CSV</button>
  </div>

  <!-- ITEM LIST -->
  <div class="section-head">
    <h2>Item list</h2>
    <button type="button" id="add-item-button">+ Add item</button>
  </div>

  <form id="item-form">
    <label>Item name <input id="name" required></label>
    <label>Site
      <select id="site">
        <option>Depop</option>
        <option>Vinted</option>
      </select>
    </label>
    <label>Status
      <select id="status">
        <option>In progress</option>
        <option>Listed</option>
        <option>Sold</option>
      </select>
    </label>

    <fieldset>
      <legend>Photos taken</legend>
      <div id="photo-boxes"></div>
    </fieldset>

    <label>Date posted <input id="posted" type="date"></label>
    <label>Date sold <input id="sold" type="date"></label>
    <label>Days to sell <input id="days" type="number" min="0" step="1"></label>

    <label>Original listed price ($) <input id="original" type="number" step="0.01" min="0" value="0"></label>
    <label>Current price ($) <input id="current" type="number" step="0.01" min="0" placeholder="same as original"></label>
    <label id="sold-for-row">Sold for ($) <input id="sold-for" type="number" step="0.01" min="0" placeholder="same as current price"></label>

    <label><input type="checkbox" id="bump"> <span id="bump-label"></span></label>
    <label id="bump-percent-row">Bump cost (% of sale price) <input id="bump-percent" type="number" step="0.1" min="0" value="12"></label>
    <div id="bump-note"></div>

    <button type="submit" id="submit-button">Add item</button>
    <button type="button" id="cancel-edit">Cancel</button>
  </form>

  <div class="list-tools">
    <label>Platform
      <select id="filter">
        <option>All</option>
        <option>Depop</option>
        <option>Vinted</option>
      </select>
    </label>
    <label>Status
      <select id="status-filter">
        <option>All</option>
        <option>In progress</option>
        <option>Listed</option>
        <option>Sold</option>
      </select>
    </label>
    <label>Remind me to lower prices after
      <input id="remind-days" type="number" min="1" step="1" value="7"> days
    </label>
  </div>
  <div id="reduce-banner"></div>
  <table>
    <thead>
      <tr><th>Photos</th><th>Item</th><th>Site</th><th>Status</th><th>Price</th><th>Profit</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  <div id="list-count" class="small count-right"></div>

  <script src="app.js"></script>
</body>
</html>
