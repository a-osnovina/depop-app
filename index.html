<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
    label { display: block; margin: 6px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid #ccc; padding: 6px; text-align: left; }
    #balance-table input { width: 110px; }
    #cancel-edit { display: none; }
    #bump-percent-row { display: none; margin-left: 24px; }
    #bump-note { margin-left: 24px; color: #444; }
    .goal { border-bottom: 1px solid #ccc; padding: 8px 0; }
    .goal progress { width: 100%; height: 16px; }
    .done { color: #666; text-decoration: line-through; }

    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .summary { display: flex; flex-wrap: wrap; gap: 24px; background: #eeeeee; border-radius: 8px; padding: 14px 18px; margin: 16px 0; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 14px; color: #444; }
    .stat-value { font-size: 20px; font-weight: bold; }
    .main .stat-value { font-size: 38px; }
    .profit { color: #1a7f37; }
    .balance { color: #0b5cad; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Resale Tracker</h1>
    <button type="button" id="export-button">Export CSV</button>
  </div>

  <h2>Items</h2>
  <form id="item-form">
    <label>Item name <input id="name" required></label>
    <label>Site
      <select id="site">
        <option>Depop</option>
        <option>Vinted</option>
      </select>
    </label>
    <label>Status
      <select id="status">
        <option>Not photographed</option>
        <option>Photographed</option>
        <option>Listed</option>
        <option>Sold</option>
      </select>
    </label>
    <label>Date posted <input id="posted" type="date"></label>
    <label>Date sold <input id="sold" type="date"></label>
    <label>Days to sell <input id="days" type="number" min="0" step="1"></label>
    <label>Sale price ($) <input id="price" type="number" step="0.01" min="0" value="0"></label>

    <label><input type="checkbox" id="bump"> <span id="bump-label"></span></label>
    <label id="bump-percent-row">Bump cost (% of sale price) <input id="bump-percent" type="number" step="0.1" min="0" value="12"></label>
    <div id="bump-note"></div>

    <label>Other fees ($) <input id="fees" type="number" step="0.01" min="0" value="0"></label>
    <label>Shipping ($) <input id="shipping" type="number" step="0.01" min="0" value="0"></label>
    <label>Cost ($) <input id="cost" type="number" step="0.01" min="0" value="0"></label>
    <button type="submit" id="submit-button">Add item</button>
    <button type="button" id="cancel-edit">Cancel edit</button>
  </form>

  <div class="summary">
    <div class="stat main">
      <span class="stat-label">Available balance</span>
      <span class="stat-value balance">$<span id="balance">0.00</span></span>
    </div>
    <div class="stat">
      <span class="stat-label">Total profit</span>
      <span class="stat-value profit">$<span id="total">0.00</span></span>
    </div>
  </div>

  <h2>Platform balances</h2>
  <table id="balance-table">
    <thead>
      <tr><th>Platform</th><th>Starting balance ($)</th><th>Item profit</th><th>Total</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Depop</td>
        <td><input id="start-Depop" type="number" step="0.01" min="0" placeholder="0.00"></td>
        <td id="item-Depop">$0.00</td>
        <td id="sum-Depop">$0.00</td>
      </tr>
      <tr>
        <td>Vinted</td>
        <td><input id="start-Vinted" type="number" step="0.01" min="0" placeholder="0.00"></td>
        <td id="item-Vinted">$0.00</td>
        <td id="sum-Vinted">$0.00</td>
      </tr>
      <tr>
        <td><strong>Combined</strong></td>
        <td id="start-all">$0.00</td>
        <td id="item-all">$0.00</td>
        <td id="sum-all"><strong>$0.00</strong></td>
      </tr>
    </tbody>
  </table>

  <h2>Goals</h2>
  <form id="goal-form">
    <label>Goal name <input id="goal-name" required></label>
    <label>Amount ($) <input id="goal-amount" type="number" step="0.01" min="0.01" required></label>
    <button type="submit">Add goal</button>
  </form>
  <div id="goal-list"></div>

  <h2>Item list</h2>
  <table>
    <thead>
      <tr><th>Item</th><th>Site</th><th>Status</th><th>Days to sell</th><th>Profit</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    // Change bump wording or the default percent for each platform here.
    const PLATFORMS = {
      Depop: { bumpLabel: "I bumped this listing on Depop", defaultPercent: 12 },
      Vinted: { bumpLabel: "I bumped this listing on Vinted (3 days)", defaultPercent: 12 }
    };
    const PLATFORM_NAMES = Object.keys(PLATFORMS);

    let items = [];
    let goals = [];
    let balances = {};
    let editingIndex = null;

    try {
      items = JSON.parse(localStorage.getItem("items")) || [];
    } catch (e) {
      items = [];
    }
    try {
      goals = JSON.parse(localStorage.getItem("goals")) || [];
    } catch (e) {
      goals = [];
    }
    try {
      balances = JSON.parse(localStorage.getItem("balances")) || {};
    } catch (e) {
      balances = {};
    }

    const form = document.getElementById("item-form");
    const submitButton = document.getElementById("submit-button");
    const cancelButton = document.getElementById("cancel-edit");
    const siteInput = document.getElementById("site");
    const priceInput = document.getElementById("price");
    const postedInput = document.getElementById("posted");
    const soldInput = document.getElementById("sold");
    const daysInput = document.getElementById("days");
    const bumpInput = document.getElementById("bump");
    const bumpPercentInput = document.getElementById("bump-percent");
    const bumpPercentRow = document.getElementById("bump-percent-row");
    const bumpNote = document.getElementById("bump-note");

    function save() {
      try {
        localStorage.setItem("items", JSON.stringify(items));
        localStorage.setItem("goals", JSON.stringify(goals));
        localStorage.setItem("balances", JSON.stringify(balances));
      } catch (e) {}
    }

    function money(n) {
      return (n < 0 ? "-" : "") + "$" + Math.abs(n).toFixed(2);
    }

    // ---- fees and profit ----
    function bumpCost(price, percent) {
      return Math.round(price * percent) / 100;
    }

    function feeTotal(item) {
      const bump = item.bump ? bumpCost(item.price, item.bumpPercent || 0) : 0;
      return (item.fees || 0) + bump;
    }

    function profitOf(item) {
      return item.price - feeTotal(item) - item.shipping - item.cost;
    }

    // ---- bump options that change with the platform ----
    function updateBumpUI(resetPercent) {
      const config = PLATFORMS[siteInput.value];
      document.getElementById("bump-label").textContent = config.bumpLabel;
      if (resetPercent) bumpPercentInput.value = config.defaultPercent;
      bumpPercentRow.style.display = bumpInput.checked ? "block" : "none";
      if (bumpInput.checked) {
        const cost = bumpCost(Number(priceInput.value) || 0, Number(bumpPercentInput.value) || 0);
        bumpNote.textContent = "Bump cost: $" + cost.toFixed(2);
      } else {
        bumpNote.textContent = "";
      }
    }

    siteInput.addEventListener("change", function () { updateBumpUI(true); });
    bumpInput.addEventListener("change", function () { updateBumpUI(false); });
    priceInput.addEventListener("input", function () { updateBumpUI(false); });
    bumpPercentInput.addEventListener("input", function () { updateBumpUI(false); });

    // ---- date helpers ----
    function parseDate(text) {
      const p = text.split("-");
      return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function formatDate(ms) {
      return new Date(ms).toISOString().slice(0, 10);
    }

    function dayDiff(fromText, toText) {
      return Math.round((parseDate(toText) - parseDate(fromText)) / 86400000);
    }

    function daysToSell(item) {
      if (!item.posted || !item.sold) return null;
      return dayDiff(item.posted, item.sold);
    }

    // ---- keep the three date fields in sync ----
    function soldFromDays() {
      if (postedInput.value && daysInput.value !== "") {
        soldInput.value = formatDate(parseDate(postedInput.value) + Number(daysInput.value) * 86400000);
      }
    }

    daysInput.addEventListener("input", soldFromDays);

    soldInput.addEventListener("input", function () {
      if (soldInput.value === "") {
        daysInput.value = "";
      } else if (postedInput.value) {
        daysInput.value = dayDiff(postedInput.value, soldInput.value);
      }
    });

    postedInput.addEventListener("input", function () {
      if (postedInput.value && soldInput.value) {
        daysInput.value = dayDiff(postedInput.value, soldInput.value);
      } else {
        soldFromDays();
      }
    });

    function cancelEdit() {
      editingIndex = null;
      form.reset();
      updateBumpUI(true);
      submitButton.textContent = "Add item";
      cancelButton.style.display = "none";
    }

    function startEdit(index) {
      const item = items[index];
      editingIndex = index;
      document.getElementById("name").value = item.name;
      siteInput.value = item.site;
      document.getElementById("status").value = item.status;
      postedInput.value = item.posted || "";
      soldInput.value = item.sold || "";
      const d = daysToSell(item);
      daysInput.value = d === null ? "" : d;
      priceInput.value = item.price;
      bumpInput.checked = !!item.bump;
      bumpPercentInput.value = item.bumpPercent || PLATFORMS[item.site].defaultPercent;
      document.getElementById("fees").value = item.fees || 0;
      document.getElementById("shipping").value = item.shipping;
      document.getElementById("cost").value = item.cost;
      updateBumpUI(false);
      submitButton.textContent = "Save changes";
      cancelButton.style.display = "inline";
      window.scrollTo(0, 0);
    }

    // ---- starting balances (typed by you) ----
    PLATFORM_NAMES.forEach(function (name) {
      const input = document.getElementById("start-" + name);
      input.value = balances[name] ? balances[name] : "";
      input.addEventListener("input", function () {
        balances[name] = Number(input.value) || 0;
        save();
        render();
      });
    });

    function renderGoals(balance) {
      const goalList = document.getElementById("goal-list");
      goalList.innerHTML = "";

      goals.forEach(function (goal, index) {
        const box = document.createElement("div");
        box.className = "goal";

        const title = document.createElement("div");
        if (goal.purchased) {
          title.className = "done";
          title.textContent = goal.name + " - $" + goal.amount.toFixed(2) + " (purchased)";
        } else {
          const have = Math.max(0, Math.min(balance, goal.amount));
          title.textContent = goal.name + " - $" + have.toFixed(2) + " of $" + goal.amount.toFixed(2);
        }
        box.appendChild(title);

        if (!goal.purchased) {
          const bar = document.createElement("progress");
          bar.max = goal.amount;
          bar.value = Math.max(0, Math.min(balance, goal.amount));
          box.appendChild(bar);
        }

        const toggle = document.createElement("button");
        toggle.textContent = goal.purchased ? "Undo" : "Mark purchased";
        toggle.onclick = function () {
          if (!goal.purchased && goal.amount > balance) {
            if (!confirm("You don't have enough balance yet. Mark it purchased anyway?")) return;
          }
          goal.purchased = !goal.purchased;
          save();
          render();
        };
        box.appendChild(toggle);

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.onclick = function () {
          if (confirm("Delete goal " + goal.name + "?")) {
            goals.splice(index, 1);
            save();
            render();
          }
        };
        box.appendChild(remove);

        goalList.appendChild(box);
      });
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      let itemTotal = 0;
      const itemByPlatform = {};
      PLATFORM_NAMES.forEach(function (name) { itemByPlatform[name] = 0; });

      items.forEach(function (item, index) {
        const row = document.createElement("tr");
        const profit = item.status === "Sold" ? profitOf(item) : null;
        if (profit !== null) {
          itemTotal += profit;
          if (itemByPlatform[item.site] !== undefined) itemByPlatform[item.site] += profit;
        }

        const d = daysToSell(item);
        const cells = [
          item.name,
          item.site,
          item.status,
          d === null ? "-" : d + (d === 1 ? " day" : " days"),
          profit === null ? "-" : money(profit)
        ];
        cells.forEach(function (text) {
          const td = document.createElement("td");
          td.textContent = text;
          row.appendChild(td);
        });

        const actionCell = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = function () {
          startEdit(index);
        };
        actionCell.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function () {
          if (confirm("Delete " + item.name + "?")) {
            items.splice(index, 1);
            cancelEdit();
            save();
            render();
          }
        };
        actionCell.appendChild(deleteButton);

        row.appendChild(actionCell);
        list.appendChild(row);
      });

      let startTotal = 0;
      PLATFORM_NAMES.forEach(function (name) {
        const start = balances[name] || 0;
        startTotal += start;
        document.getElementById("item-" + name).textContent = money(itemByPlatform[name]);
        document.getElementById("sum-" + name).textContent = money(start + itemByPlatform[name]);
      });

      const total = itemTotal + startTotal;
      document.getElementById("start-all").textContent = money(startTotal);
      document.getElementById("item-all").textContent = money(itemTotal);
      document.getElementById("sum-all").textContent = money(total);

      let spent = 0;
      goals.forEach(function (goal) {
        if (goal.purchased) spent += goal.amount;
      });
      const balance = total - spent;

      document.getElementById("total").textContent = total.toFixed(2);
      document.getElementById("balance").textContent = balance.toFixed(2);
      renderGoals(balance);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (postedInput.value && soldInput.value && dayDiff(postedInput.value, soldInput.value) < 0) {
        alert("The sold date can't be earlier than the posted date.");
        return;
      }

      const item = {
        name: document.getElementById("name").value,
        site: siteInput.value,
        status: document.getElementById("status").value,
        posted: postedInput.value,
        sold: soldInput.value,
        price: Number(priceInput.value),
        bump: bumpInput.checked,
        bumpPercent: Number(bumpPercentInput.value) || 0,
        fees: Number(document.getElementById("fees").value),
        shipping: Number(document.getElementById("shipping").value),
        cost: Number(document.getElementById("cost").value)
      };
      if (editingIndex === null) {
        items.push(item);
      } else {
        items[editingIndex] = item;
      }
      cancelEdit();
      save();
      render();
    });

    cancelButton.addEventListener("click", cancelEdit);

    document.getElementById("goal-form").addEventListener("submit", function (event) {
      event.preventDefault();
      goals.push({
        name: document.getElementById("goal-name").value,
        amount: Number(document.getElementById("goal-amount").value),
        purchased: false
      });
      save();
      render();
      event.target.reset();
    });

    function csvCell(value) {
      let text = String(value);
      if (/^[=+\-@]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    }

    document.getElementById("export-button").addEventListener("click", function () {
      const rows = [["Item", "Site", "Status", "Date posted", "Date sold", "Days to sell", "Sale price", "Other fees", "Bumped", "Bump %", "Total fees", "Shipping", "Cost", "Profit"]];
      items.forEach(function (item) {
        const d = daysToSell(item);
        rows.push([
          item.name, item.site, item.status,
          item.posted || "", item.sold || "", d === null ? "" : d,
          item.price.toFixed(2), (item.fees || 0).toFixed(2),
          item.bump ? "Yes" : "No", item.bump ? (item.bumpPercent || 0) : "",
          feeTotal(item).toFixed(2),
          item.shipping.toFixed(2), item.cost.toFixed(2),
          item.status === "Sold" ? profitOf(item).toFixed(2) : ""
        ]);
      });
      const csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "resale-items.csv";
      link.click();
    });

    updateBumpUI(true);
    render();
  </script>
</body>
</html>
